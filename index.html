<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rocket League Hub</title>

  <style>
    * {
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #070b16;
      color: white;
    }

    header {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      background:
        radial-gradient(circle at top, #164b91, transparent 45%),
        linear-gradient(135deg, #101a38, #070b16);
    }

    .hero h1 {
      font-size: clamp(42px, 10vw, 80px);
      margin: 0;
      text-shadow: 0 0 20px #268cff;
    }

    .hero p {
      font-size: 20px;
      color: #c7d4ee;
      max-width: 650px;
      margin: 20px auto;
      line-height: 1.5;
    }

    .boton {
      display: inline-block;
      padding: 14px 24px;
      background: #168cff;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
      margin: 8px;
      transition: 0.2s;
    }

    .boton:hover {
      transform: translateY(-3px);
      background: #36a2ff;
    }

    nav {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #0d1325;
      border-bottom: 1px solid #263454;
      padding: 14px 8px;
      text-align: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 5px 8px;
      font-weight: bold;
      font-size: 14px;
    }

    nav a:hover {
      color: #35a7ff;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    section {
      padding: 50px 0;
    }

    .titulo {
      text-align: center;
      margin-bottom: 30px;
    }

    .titulo h2 {
      font-size: 32px;
      margin-bottom: 10px;
      color: #38a5ff;
    }

    .titulo p {
      color: #aeb9cf;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .card {
      background: #11192d;
      border: 1px solid #273858;
      border-radius: 16px;
      padding: 22px;
      transition: 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: #329dff;
    }

    .card h3 {
      margin-top: 0;
      color: #ffffff;
    }

    .card p {
      color: #b8c3d8;
      line-height: 1.6;
    }

    .rango {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
    }

    .bronce { color: #c98d62; }
    .plata { color: #c8d2df; }
    .oro { color: #ffd447; }
    .platino { color: #6de0df; }
    .diamante { color: #48a8ff; }
    .champion { color: #bd65ff; }
    .grandchampion { color: #ff596d; }

    .entrenamiento {
      background: linear-gradient(135deg, #101d3c, #11192d);
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 15px;
      border: 1px solid #2a426d;
    }

    .entrenamiento h3 {
      color: #42d392;
    }

    .lista {
      line-height: 2;
      color: #c3ccdc;
    }

    .cta {
      text-align: center;
      background: linear-gradient(135deg, #0e3970, #11192d);
      border-radius: 20px;
      padding: 45px 20px;
      margin: 40px 0;
    }

    #mensaje {
      color: #42d392;
      font-weight: bold;
      margin-top: 15px;
    }

    footer {
      text-align: center;
      padding: 35px 20px;
      background: #050810;
      color: #77829a;
      border-top: 1px solid #1c2944;
    }

    @media (max-width: 600px) {
      nav a {
        display: inline-block;
        margin: 6px;
      }

      .hero p {
        font-size: 17px;
      }

      section {
        padding: 35px 0;
      }
    }
  </style>
</head>

<body>

  <!-- INICIO -->
  <header id="inicio">
    <div class="hero">
      <h1>🚗⚽ ROCKET LEAGUE</h1>

      <p>
        Bienvenido a Rocket League Hub.
