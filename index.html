<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rocket League Hub</title>

<style>
*{
  box-sizing:border-box;
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#070b16;
  color:white;
}

header{
  min-height:420px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:40px 20px;
  background:linear-gradient(135deg,#071126,#123b75,#080d1c);
}

.hero h1{
  font-size:clamp(45px,10vw,90px);
  margin:10px 0;
  text-shadow:0 0 25px #168cff;
}

.hero p{
  font-size:22px;
  color:#c8d3e8;
}

.car{
  font-size:70px;
}

nav{
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  padding:15px;
  background:#11182b;
  border-bottom:1px solid #263452;
}

nav a{
  color:white;
  text-decoration:none;
  padding:12px 18px;
  border-radius:12px;
  font-weight:bold;
  transition:.2s;
}

nav a:hover{
  background:#168cff;
  transform:translateY(-2px);
}

.container{
  max-width:1100px;
  margin:auto;
  padding:30px 18px;
}

section{
  margin:35px 0;
  padding:30px;
  background:#11182b;
  border:1px solid #263452;
  border-radius:22px;
  box-shadow:0 10px 35px #0005;
}

h2{
  color:#35a7ff;
  font-size:32px;
  margin-top:0;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:18px;
}

.card{
  background:#0b1020;
  padding:22px;
  border-radius:17px;
  border:1px solid #202c47;
  transition:.25s;
}

.card:hover{
  transform:translateY(-5px);
  border-color:#168cff;
}

  color:#42d
